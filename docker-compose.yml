services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: company_control
      POSTGRES_USER: company_control
      POSTGRES_PASSWORD: company_control
    ports:
      - "5432:5432"
    volumes:
      - company-control-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_control"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  company-control-postgres:
